# PRIVATE: contains subscription URLs and/or node credentials. Never publish.
# Hitun/Renzhe: update every 3 days. Nexitally: HTTP manual refresh only, interval 0.
# Missing/invalid HTTP cache can still trigger initialization downloads.
dns:
  enable: true
  listen: 127.0.0.1:7874
  ipv6: false
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  respect-rules: true
  prefer-h3: false
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  nameserver:
  - https://1.1.1.1/dns-query#节点选择
  - https://8.8.8.8/dns-query#节点选择
  nameserver-policy:
    smtp.gmail.com:
    - 223.5.5.5
    - 223.6.6.6
    rule-set:direct,private:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localdomain
  - +.home.arpa
  - +.arpa
  - localhost
  - time.*.com
  - time.*.gov
  - +.pool.ntp.org
  - +.ntp.org
  - +.msftconnecttest.com
  - +.msftncsi.com
  - stun.*.*
  - stun.*.*.*
  - +.stun.playstation.net
  - +.srv.nintendo.net
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  proxy-server-nameserver-policy:
    2e864e57-6ba8-4073-822c-9b4de704d43d.dmdzuspah1.sbs:
    - https://iqsjp.com:44443/dns-query/93620255-e844-4ba8-a8c3-7fb849582e6c#DIRECT
    - https://destitute2725.com:44443/dns-query/93620255-e844-4ba8-a8c3-7fb849582e6c#DIRECT
    - https://prolonged3729.com:443/dns-query/93620255-e844-4ba8-a8c3-7fb849582e6c#DIRECT
    811f4d1d-e418-4c2c-a007-c01f194e4b19.dmdzuspah1.sbs:
    - https://iqsjp.com:44443/dns-query/93620255-e844-4ba8-a8c3-7fb849582e6c#DIRECT
    - https://destitute2725.com:44443/dns-query/93620255-e844-4ba8-a8c3-7fb849582e6c#DIRECT
    - https://prolonged3729.com:443/dns-query/93620255-e844-4ba8-a8c3-7fb849582e6c#DIRECT
profile:
  store-selected: true
  store-fake-ip: true
unified-delay: true
tcp-concurrent: true
sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: true
  override-destination: false
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: false
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - dlg.io.mi.com
  - +.oray.com
  - +.sunlogin.net
  - +.push.apple.com
